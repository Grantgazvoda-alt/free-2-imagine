name: Save Bundle Baseline

on:
  push:
    branches: [main]
    paths:
      - "app/**"

jobs:
  save-baseline:
    name: Save Bundle Size Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to push back
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: app
        run: |
          rm -rf node_modules
          bun install

      - name: Build
        working-directory: app
        run: bun run build:dev

      - name: Save bundle baseline
        working-directory: app
        run: node scripts/bundle-diff.mjs --save-baseline

      - name: Commit and push baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/dist/bundle-baseline.json
          git diff --staged --quiet || git commit -m "chore: update bundle baseline [skip ci]"
          git push