name: E2E Coverage

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/e2e-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/e2e-coverage.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: "https://orgasmo.higgsfield.app"
  REQUIRED_PASS_RATE: 100

jobs:
  test-and-coverage:
    name: E2E tests + coverage report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      - name: Run E2E tests
        id: tests
        working-directory: ./app
        run: |
          bun test tests/*.test.ts 2>&1 | tee /tmp/test-output.txt
        timeout-minutes: 5
        continue-on-error: true

      - name: Generate coverage report
        id: coverage
        working-directory: ./app
        run: |
          node scripts/test-coverage.mjs 2>&1 | tee /tmp/coverage-output.txt
          echo "report_path=$(pwd)/tests/coverage-report.md" >> $GITHUB_OUTPUT

      - name: Parse results
        id: parse
        run: |
          PASS_COUNT=$(grep -oP '^\s*\d+\s+pass' /tmp/test-output.txt | grep -oP '\d+' || echo "0")
          FAIL_COUNT=$(grep -oP '^\s*\d+\s+fail' /tmp/test-output.txt | grep -oP '\d+' || echo "0")
          TOTAL=$((PASS_COUNT + FAIL_COUNT))
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$((PASS_COUNT * 100 / TOTAL))
          else
            RATE=0
          fi

          echo "pass_count=$PASS_COUNT" >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "pass_rate=$RATE" >> $GITHUB_OUTPUT

          if [ "$FAIL_COUNT" -gt 0 ] || [ "$RATE" -lt "$REQUIRED_PASS_RATE" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Generate coverage badge
        id: badge
        run: |
          RATE=${{ steps.parse.outputs.pass_rate }}
          STATUS=${{ steps.parse.outputs.status }}

          if [ "$STATUS" = "success" ]; then
            COLOR="brightgreen"
            LABEL="passing"
          elif [ "$RATE" -gt 0 ]; then
            COLOR="yellow"
            LABEL="${RATE}%25"
          else
            COLOR="red"
            LABEL="failing"
          fi

          mkdir -p /tmp/badge

          # Generate SVG badge
          cat > /tmp/badge/coverage.svg << BADGEEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img" aria-label="coverage: ${RATE}%25">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="140" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="74" height="20" fill="#555"/>
              <rect x="74" width="66" height="20" fill="#${COLOR}"/>
              <rect width="140" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="37" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="37" y="14">coverage</text>
              <text x="106" y="15" fill="#010101" fill-opacity=".3">${LABEL}</text>
              <text x="106" y="14">${LABEL}</text>
            </g>
          </svg>
          BADGEEOF

          # Generate JSON badge data for shields.io dynamic badge
          cat > /tmp/badge/coverage.json << JSONEOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${RATE}%25",
            "color": "${COLOR}"
          }
          JSONEOF

          echo "badge_path=/tmp/badge" >> $GITHUB_OUTPUT

      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: /tmp/badge/
          retention-days: 90
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ steps.coverage.outputs.report_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt
          retention-days: 30
          if-no-files-found: error

      - name: Read coverage report
        id: report
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat ${{ steps.coverage.outputs.report_path }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passCount = parseInt('${{ steps.parse.outputs.pass_count }}');
            const failCount = parseInt('${{ steps.parse.outputs.fail_count }}');
            const total = parseInt('${{ steps.parse.outputs.total }}');
            const rate = parseInt('${{ steps.parse.outputs.pass_rate }}');
            const status = '${{ steps.parse.outputs.status }}';
            const required = parseInt('${{ env.REQUIRED_PASS_RATE }}');

            const icon = status === 'success' ? '✅' : '❌';
            const header = `${icon} **E2E Coverage Report** — ${passCount}/${total} passed (${rate}%)`;

            const body = [
              `## ${header}`,
              '',
              '| Metric | Value |',
              '|---|---|',
              `| Total Tests | ${total} |`,
              `| Passed | ${passCount} |`,
              `| Failed | ${failCount} |`,
              `| Pass Rate | ${rate}% |`,
              `| Required | ${required}% |`,
              `| Status | ${status === 'success' ? '✅ Passed' : '❌ Failed'} |`,
              '',
              status === 'success'
                ? 'All tests pass. Coverage meets the 100% threshold.'
                : `⚠️ Coverage dropped below ${required}%. ${failCount} test(s) failing.`,
              '',
              '### Coverage Badge',
              `![coverage](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/${{ github.repository }}/main/coverage-badge.json)`,
              '',
              '### Coverage by Area',
              '',
              '| Area | Status |',
              '|---|---|',
              '| Infrastructure | ✅ Page loads, assets, security headers, SSR |',
              '| App Features | ✅ Generation, upload, cost, auth, templates, bulk |',
              '| Unit/Integration | ✅ Auth, FNF, approval, results, history, projects, security |',
              '| Generation Flow | ✅ PromptBox, gpt_image_2, batchSize, sign-in, pick-best |',
              '',
              '### Artifacts',
              `- [Coverage Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              `- [Coverage Badge](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              '',
              '---',
              `*CI check generated at ${new Date().toISOString()}*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes('E2E Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Check coverage threshold
        if: steps.parse.outputs.status == 'failure'
        run: |
          echo "❌ Coverage check failed: ${{ steps.parse.outputs.pass_rate }}% (required: ${{ env.REQUIRED_PASS_RATE }}%)"
          echo "Failed tests: ${{ steps.parse.outputs.fail_count }}"
          exit 1

      - name: Coverage passed
        if: steps.parse.outputs.status == 'success'
        run: |
          echo "✅ All ${{ steps.parse.outputs.total }} tests pass (${{ steps.parse.outputs.pass_rate }}% coverage)"